# Publica o somun hub no GitHub Pages a cada envio (Settings › Pages › Source: GitHub Actions).
# Arquivo novo no site tem de entrar na linha "cp" abaixo.
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Junta os arquivos do site
        run: mkdir site && cp index.html firebase-config.js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Espera o pacote aparecer
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
